# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# If you need help with YAML syntax, here are some quick references for you:
# https://learn-the-web.algonquindesign.ca/topics/markdown-yaml-cheat-sheet/#yaml
# https://learnxinyminutes.com/docs/yaml/
#
# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

title: Murat Bahadır KAYIHAN
email: mbkayihan@gmail.com
description: >-
  Backend ve Mobil Geliştirici. Spring Boot, Kotlin, Android ve iOS uygulama geliştirme üzerine yazılar.
  Yazılım geliştirme, teknoloji ve kişisel deneyimlerimi paylaşıyorum.
baseurl: ""
url: "https://mbkayihan.github.io"
author: Murat Bahadır KAYIHAN

# SEO settings
twitter:
  username: mbkayihan
  card: summary_large_image
social:
  name: Murat Bahadır KAYIHAN
  links:
    - https://twitter.com/mbkayihan
    - https://www.linkedin.com/in/mbkayihan
    - https://github.com/mbkayihan

# Google Analytics
google_analytics: UA-XXXXXXXX-X

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# Theme settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Pagination
paginate: 5
paginate_path: "/blog/page:num/"

# Collections
collections:
  projects:
    output: true

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: true

# Social links
github_username: mbkayihan
linkedin_username: mbkayihan

# Site settings
lang: tr
timezone: Europe/Istanbul

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git/
  - .github/
  - .gitignore
