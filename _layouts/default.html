<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {% endif %}Murat Bahadır KAYIHAN</title>
    <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        .gradient-border {
            position: relative;
            border-radius: 0.5rem;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            padding: 0.25rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .gradient-border::before {
            content: '';
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #0ff, #f0f);
            opacity: 0;
            transition: opacity 0.3s ease;
            border-bottom-left-radius: 0.5rem;
            border-bottom-right-radius: 0.5rem;
            animation: neonFlicker 4s infinite;
        }
        
        .gradient-border:hover::before {
            opacity: 1;
        }

        /* Diğer CSS stilleri buraya */
        
        .logo-text {
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            color: #80ced7;
            text-shadow: 0 0 10px rgba(128, 206, 215, 0.3);
            transition: all 0.3s ease;
        }

        .logo-text:hover {
            text-shadow: 0 0 20px rgba(128, 206, 215, 0.5);
            transform: scale(1.05);
        }

        .gradient-text {
            background: linear-gradient(to right, #0ff, #f0f, #ff8c00);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-block;
        }
    </style>
</head>
<body class="bg-black text-gray-100">
    {% include loading.html %}
    
    <!-- Fare efekti için div -->
    <div class="cursor-fx"></div>

    <!-- Navigasyon -->
    <nav class="fixed w-full bg-black bg-opacity-70 backdrop-blur-md z-50 border-b border-gray-800">
        <div class="container mx-auto px-6 py-4">
            <div class="flex items-center justify-between">
                <a href="/" class="logo-text">M.B. KAYIHAN</a>
                <div class="hidden md:flex space-x-8">
                    <a href="/" class="nav-link {% if page.url == '/' %}active{% endif %}">Hakkımda</a>
                    <a href="/yetenekler" class="nav-link {% if page.url == '/yetenekler' %}active{% endif %}">Yetenekler</a>
                    <a href="/projeler" class="nav-link {% if page.url == '/projeler' %}active{% endif %}">Projeler</a>
                    <a href="/blog" class="nav-link {% if page.url == '/blog' %}active{% endif %}">Blog</a>
                    <a href="/iletisim" class="nav-link {% if page.url == '/iletisim' %}active{% endif %}">İletişim</a>
                </div>
                <button class="md:hidden" id="menu-button">
                    <i class="fas fa-bars text-2xl"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Mobil Menü -->
    <div class="fixed inset-0 bg-black bg-opacity-95 backdrop-blur-lg z-40 hidden" id="mobile-menu">
        <div class="flex flex-col items-center justify-center h-full space-y-8">
            <a href="/" class="text-xl hover:text-cyan-400 transition-colors">Hakkımda</a>
            <a href="/yetenekler" class="text-xl hover:text-cyan-400 transition-colors">Yetenekler</a>
            <a href="/projeler" class="text-xl hover:text-cyan-400 transition-colors">Projeler</a>
            <a href="/blog" class="text-xl hover:text-cyan-400 transition-colors">Blog</a>
            <a href="/iletisim" class="text-xl hover:text-cyan-400 transition-colors">İletişim</a>
        </div>
    </div>

    <!-- İçerik -->
    {{ content }}

    <!-- Footer -->
    <footer class="bg-black/30 backdrop-blur-sm mt-32 border-t border-gray-800/50">
        <div class="container mx-auto px-6 py-6">
            <div class="flex flex-col md:flex-row justify-between items-center space-y-4 md:space-y-0">
                <a href="/" class="font-light tracking-wider text-xl" style="color: #C0C0C0; text-shadow: 0 0 10px rgba(192, 192, 192, 0.3);">
                    M.B. KAYIHAN
                </a>

                <div class="flex space-x-8">
                    <a href="https://github.com/MuratBahadirKayihan" target="_blank" class="text-gray-500 hover:text-cyan-400 transition-all transform hover:-translate-y-1">
                        <i class="fab fa-github"></i>
                    </a>
                    <a href="https://www.linkedin.com/in/murat-bahad%C4%B1r-kayihan-058841186/" target="_blank" class="text-gray-500 hover:text-cyan-400 transition-all transform hover:-translate-y-1">
                        <i class="fab fa-linkedin"></i>
                    </a>
                    <a href="https://x.com/mbkayihan" target="_blank" class="text-gray-500 hover:text-cyan-400 transition-all transform hover:-translate-y-1">
                        <i class="fab fa-x-twitter"></i>
                    </a>
                    <a href="https://www.instagram.com/muratbahadirkayihan/" target="_blank" class="text-gray-500 hover:text-cyan-400 transition-all transform hover:-translate-y-1">
                        <i class="fab fa-instagram"></i>
                    </a>
                </div>

                <p class="text-gray-500 text-sm font-light">
                    &copy; {{ 'now' | date: "%Y" }}
                </p>
            </div>
        </div>
    </footer>

    <script src="{{ '/js/main.js' | relative_url }}"></script>
</body>
</html>
